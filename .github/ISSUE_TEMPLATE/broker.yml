name: Broker adapter
description: Request or offer an adapter for a broker
labels: [broker]
body:
  - type: input
    id: broker
    attributes: { label: Broker }
    validations: { required: true }
  - type: textarea
    id: api
    attributes: { label: API notes, description: 'Docs link, whether there is a sandbox, how sign-in works' }
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can write the adapter
        - label: I can test against a sandbox account
